<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhar</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* TOPO: Carrinho e Moedas */
        .topo-esquerda {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-carrinho {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #00d8ff;
            background: #000;
            color: #00d8ff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 216, 255, 0.3);
        }

        .hud-moedas {
            border: 2px solid #ffcc00;
            border-radius: 20px;
            padding: 5px 15px;
            background: #000;
            color: #ffcc00;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }

        /* TOPO DIR: Top Recordes */
        .topo-direita {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 220px;
        }

        .box-recordes {
            border: 2px solid #00d8ff;
            border-radius: 10px;
            padding: 10px;
            background: #000;
            box-shadow: 0 0 10px rgba(0, 216, 255, 0.2);
        }

        .titulo-recordes {
            color: #ffcc00;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 1px;
        }

        .content-recordes {
            background: #111;
            border: 1px solid #222;
            border-radius: 5px;
            padding: 8px;
            min-height: 45px;
            font-size: 11px;
            color: #666;
            text-align: center;
        }

        .content-recordes li {
            list-style: none;
            display: flex;
            justify-content: space-between;
            color: #aaa;
            margin-bottom: 3px;
        }

        /* CONTAINER CENTRAL */
        .main-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .titulo-secao {
            color: #00d8ff;
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
        }

        /* GRID DE FASES (3 COLUNAS) */
        .grid-fases {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 360px;
        }

        .card-fase {
            aspect-ratio: 1;
            background: #000;
            border: 2px solid #222;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 4px;
            transition: all 0.2s;
        }

        .card-fase.ativa {
            border-color: #00d8ff;
            box-shadow: 0 0 12px rgba(0, 216, 255, 0.4);
        }

        .num-fase {
            font-size: 26px;
            font-weight: bold;
            color: #00d8ff;
        }

        .icone-fase {
            font-size: 22px;
            color: #ffcc00;
        }

        .sub-fase {
            color: #ffcc00;
            font-size: 12px;
        }

        /* BOTÕES DE MENU E AÇÕES */
        .btn-acao {
            background: #000;
            border: 2px solid #00d8ff;
            color: #00d8ff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            width: 100%;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-acao:hover {
            background: #00d8ff;
            color: #000;
        }

        .btn-secundario {
            border-color: #333;
            color: #aaa;
        }

        .btn-secundario:hover {
            border-color: #fff;
            color: #fff;
            background: transparent;
        }

        /* INPUTS */
        input[type="text"], input[type="number"] {
            background: #000;
            border: 2px solid #00d8ff;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            text-align: center;
            outline: none;
            width: 100%;
        }

        .modal-loja {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 100;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- HUD TOPO -->
    <div class="topo-esquerda" id="hud-topo" style="display: none;">
        <button class="btn-carrinho" onclick="toggleLoja(true)">🛒</button>
        <div class="hud-moedas">
            <span style="background: #ffcc00; color: #000; border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px;">$</span>
            <span id="saldo-moedas">0</span>
        </div>
    </div>

    <div class="topo-direita">
        <div class="box-recordes">
            <div class="titulo-recordes">🏆 TOP RECORDES</div>
            <div class="content-recordes" id="lista-recordes">
                Sem recordes
            </div>
        </div>
    </div>

    <!-- TELA 0: INÍCIO / MENU PRINCIPAL -->
    <div class="main-container" id="tela-inicio">
        <div class="titulo-secao">ADIVINHE O NÚMERO</div>
        <button class="btn-acao" onclick="selecionarModo(1)">Modo Campanha</button>
        <button class="btn-acao" onclick="selecionarModo(2)">Modo Duelo 1v1</button>
        <button class="btn-acao" style="border-color: #ffcc00; color: #ffcc00;" onclick="iniciarRelampago()">Modo Relâmpago ⚡</button>
    </div>

    <!-- TELA 1: NOME / LOGIN -->
    <div class="main-container" id="tela-login" style="display: none;">
        <div class="titulo-secao" id="titulo-login">SEU NOME</div>
        <input type="text" id="nick1" placeholder="Nome Jogador 1" maxlength="12">
        <input type="text" id="nick2" placeholder="Nome Jogador 2" maxlength="12" style="display: none;">
        <button class="btn-acao" onclick="iniciarJogo()">JOGAR</button>
        <button class="btn-acao btn-secundario" onclick="voltarMenu()">VOLTAR</button>
    </div>

    <!-- TELA 2: SELEÇÃO DE FASES (MAPA) -->
    <div class="main-container" id="tela-mapa" style="display: none;">
        <div class="titulo-secao">SELEÇÃO DE FASES</div>
        <div class="grid-fases" id="grid-levels"></div>
        <button class="btn-acao btn-secundario" onclick="voltarMenu()">SAIR</button>
    </div>

    <!-- TELA 3: JOGO -->
    <div class="main-container" id="tela-jogo" style="display: none;">
        <div class="titulo-secao" id="lvl-titulo">LEVEL 1</div>
        <p id="instrucao-jogo" style="color: #aaa; font-size: 14px;">Adivinhe o número</p>
        <div id="vez-player" style="color: #ffcc00; font-size: 13px;"></div>

        <input type="number" id="chute" placeholder="Seu palpite">
        <button class="btn-acao" id="btn-chutar" onclick="chutar()">CHUTAR</button>

        <p id="status-chances" style="color: #ffcc00; font-size: 13px;"></p>
        <p id="msg-feedback" style="font-weight: bold; font-size: 15px; min-height: 20px;"></p>
        <p id="info-dica" style="color: #00d8ff; font-size: 13px;"></p>

        <button class="btn-acao btn-secundario" onclick="irParaMapa()">VOLTAR</button>
    </div>

    <!-- MODAL LOJA -->
    <div id="modalLoja" class="modal-loja">
        <div class="titulo-secao">LOJA DE DICAS</div>
        <button class="btn-acao" onclick="buy(1)">Par ou Ímpar (30 $)</button>
        <button class="btn-acao" onclick="buy(2)">Último Dígito (60 $)</button>
        <button class="btn-acao" onclick="buy(4)">+2 Chances (80 $)</button>
        <button class="btn-acao" style="border-color: #ff0055; color: #ff0055;" onclick="toggleLoja(false)">FECHAR</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyC6NesXVh5ZcwH2_ceLS65AKu5AbingFZs",
          authDomain: "jogo-de-adivinhar-e8f79.firebaseapp.com",
          databaseURL: "https://jogo-de-adivinhar-e8f79-default-rtdb.firebaseio.com/",
          projectId: "jogo-de-adivinhar-e8f79",
          storageBucket: "jogo-de-adivinhar-e8f79.firebasestorage.app",
          messagingSenderId: "752330414069",
          appId: "1:752330414069:web:eb8197e93146cc07c3b2bc"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let modoAtual = 1, p1 = "", p2 = "", pVez = 1;
        let lvl = 1, num = 0, ch = 0, maxNum = 15, moedas = 0;
        let chutesNoLevel = 0, pontuacaoTotal = 0;
        let progresso = { maxDesbloqueado: 1 };

        function $(id) { return document.getElementById(id); }

        function carregarRankings() {
            db.ref("ranking").orderByChild("score").limitToLast(3).on("value", (snapshot) => {
                let el = $("lista-recordes");
                if (!snapshot.exists()) {
                    el.innerHTML = "Sem recordes";
                    return;
                }
                let arr = [];
                snapshot.forEach(c => arr.push(c.val()));
                arr.sort((a,b) => b.score - a.score);
                let html = "<ul style='padding:0;'>";
                arr.forEach(p => {
                    html += `<li><span>${p.nome}</span> <span>${p.score}pts</span></li>`;
                });
                html += "</ul>";
                el.innerHTML = html;
            });
        }
        carregarRankings();

        function selecionarModo(m) {
            modoAtual = m;
            $("tela-inicio").style.display = "none";
            $("tela-login").style.display = "flex";
            $("titulo-login").textContent = m === 2 ? "JOGADORES 1v1" : "SEU NOME";
            $("nick2").style.display = m === 2 ? "block" : "none";
        }

        function iniciarJogo() {
            p1 = $("nick1").value.trim();
            p2 = $("nick2").value.trim();
            if (!p1 || (modoAtual === 2 && !p2)) return;

            $("tela-login").style.display = "none";
            $("hud-topo").style.display = "flex";
            irParaMapa();
        }

        function irParaMapa() {
            $("tela-jogo").style.display = "none";
            $("tela-mapa").style.display = "flex";
            renderizarMapa();
        }

        function renderizarMapa() {
            let grid = $("grid-levels");
            grid.innerHTML = "";
            for (let i = 1; i <= 6; i++) {
                let desbloqueado = i <= progresso.maxDesbloqueado;
                let card = document.createElement("div");
                card.className = `card-fase ${desbloqueado ? 'ativa' : ''}`;
                
                if (desbloqueado) {
                    card.innerHTML = `<div class="num-fase">${i}</div><div class="sub-fase">---</div>`;
                    card.onclick = () => iniciarNivel(i);
                } else {
                    card.innerHTML = `<div class="icone-fase">🔒</div><div class="sub-fase">---</div>`;
                }
                grid.appendChild(card);
            }
        }

        function iniciarNivel(n) {
            lvl = n;
            maxNum = 10 + (n * 5);
            ch = 8 - Math.floor(n / 2);
            num = Math.floor(Math.random() * maxNum) + 1;
            chutesNoLevel = 0;

            $("tela-mapa").style.display = "none";
            $("tela-jogo").style.display = "flex";
            $("lvl-titulo").textContent = `LEVEL ${lvl}`;
            $("instrucao-jogo").textContent = `Adivinhe de 1 a ${maxNum}`;
            $("status-chances").textContent = `Chances: ${ch}`;
            $("vez-player").textContent = modoAtual === 2 ? `TURNO DE: ${pVez === 1 ? p1 : p2}` : "";
            $("msg-feedback").textContent = "";
            $("info-dica").textContent = "";
            $("chute").value = "";
            $("btn-chutar").disabled = false;
        }

        function chutar() {
            let p = Number($("chute").value);
            if (!p) return;

            ch--;
            chutesNoLevel++;
            $("status-chances").textContent = `Chances: ${ch}`;

            if (p === num) {
                moedas += 10 + (lvl * 5);
                $("saldo-moedas").textContent = moedas;
                $("msg-feedback").style.color = "#00d8ff";
                $("msg-feedback").textContent = "CORRETO!";
                $("btn-chutar").disabled = true;

                pontuacaoTotal += Math.max(10, 100 - (chutesNoLevel * 10));

                if (lvl === progresso.maxDesbloqueado && progresso.maxDesbloqueado < 6) {
                    progresso.maxDesbloqueado++;
                }

                // Salva no banco APENAS no ZERAR (Level 6)
                if (lvl === 6) {
                    let nomeFinal = modoAtual === 2 ? (pVez === 1 ? p1 : p2) : p1;
                    db.ref("ranking").push({
                        nome: nomeFinal,
                        score: pontuacaoTotal,
                        data: Date.now()
                    });
                }

                setTimeout(irParaMapa, 1500);
            } else {
                $("msg-feedback").style.color = "#ff0055";
                $("msg-feedback").textContent = p < num ? "MAIOR ↑" : "MENOR ↓";

                if (modoAtual === 2) {
                    pVez = pVez === 1 ? 2 : 1;
                    $("vez-player").textContent = `TURNO DE: ${pVez === 1 ? p1 : p2}`;
                }

                if (ch <= 0) {
                    $("msg-feedback").textContent = `GAMEOVER! Era ${num}`;
                    $("btn-chutar").disabled = true;
                    setTimeout(irParaMapa, 2000);
                }
            }
            $("chute").value = "";
        }

        function toggleLoja(abrir) {
            $("modalLoja").style.display = abrir ? "flex" : "none";
        }

        function buy(tipo) {
            if (tipo === 1 && moedas >= 30) {
                moedas -= 30;
                $("info-dica").textContent = `💡 O número é ${(num % 2 === 0) ? "PAR" : "ÍMPAR"}`;
            } else if (tipo === 2 && moedas >= 60) {
                moedas -= 60;
                $("info-dica").textContent = `🔍 Termina em ${num % 10}`;
            } else if (tipo === 4 && moedas >= 80) {
                moedas -= 80;
                ch += 2;
                $("status-chances").textContent = `Chances: ${ch}`;
            }
            $("saldo-moedas").textContent = moedas;
            toggleLoja(false);
        }

        function iniciarRelampago() {
            let nome = prompt("Seu nome para o Relâmpago:", "Visitante") || "Visitante";
            p1 = nome;
            modoAtual = 1;
            iniciarNivel(1);
        }

        function voltarMenu() {
            $("tela-mapa").style.display = "none";
            $("tela-login").style.display = "none";
            $("tela-jogo").style.display = "none";
            $("hud-topo").style.display = "none";
            $("tela-inicio").style.display = "flex";
        }
    </script>
</body>
</html>
